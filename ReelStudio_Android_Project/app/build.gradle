plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reelstudio.facebook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.reelstudio.facebook'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
}
