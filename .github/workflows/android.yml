name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Compilar APK
        working-directory: ReelStudio_Android_Project
        run: gradle assembleDebug -Pandroid.useAndroidX=true

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelStudio-APK
          path: ReelStudio_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
